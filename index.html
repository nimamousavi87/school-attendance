
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="سامانه هوشمند حضور و غیاب هنرستان علم و فن">
  <title>ورود | هنرستان علم و فن</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, #15366b55, transparent 35%),
        radial-gradient(circle at 85% 85%, #164e6355, transparent 35%),
        #080d18;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      background: #111a2b;
      border: 1px solid #263c5c;
      border-radius: 24px;
      box-shadow: 0 25px 80px #0008;
    }

    .logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      font-size: 35px;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 22px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin: 19px 0 9px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 14px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px #2563eb22;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      min-height: 49px;
      padding: 14px;
      margin-top: 25px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.9;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .error {
      display: block;
      color: #fecaca;
      background: #7f1d1d44;
      border: 1px solid #991b1b;
    }

    .success {
      display: block;
      color: #bbf7d0;
      background: #14532d44;
      border: 1px solid #166534;
    }

    .footer {
      margin-top: 27px;
      color: #64748b;
      font-size: 11px;
      text-align: center;
      line-height: 2;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .login-card {
        padding: 30px 21px;
        border-radius: 19px;
      }

      h1 {
        font-size: 21px;
      }
    }

    @media (max-height: 600px) {
      body {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">🏫</div>

    <h1>هنرستان علم و فن</h1>

    <p class="subtitle">
      سامانه هوشمند مدیریت حضور و غیاب دانش‌آموزان
    </p>

    <h2 class="section-title">ورود به حساب کاربری</h2>

    <form id="loginForm">

      <label for="username">نام کاربری</label>
      <input
        id="username"
        type="text"
        placeholder="نام کاربری خود را وارد کنید"
        autocomplete="username"
        required
      >

      <label for="password">رمز عبور</label>
      <input
        id="password"
        type="password"
        placeholder="رمز عبور خود را وارد کنید"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        ورود به سامانه
      </button>

    </form>

    <div id="message" class="message" role="status"></div>

    <div class="footer">
      هنرستان علم و فن
      <br>
      سامانه اختصاصی مدیریت آموزشی و حضور و غیاب
    </div>

  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://tmogtldkiyxzdvercwro.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LMwuOofGL2VvLX1eE47czA_QLzYb1lU";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = document
        .getElementById("username")
        .value.trim().toLowerCase();

      const password = document
        .getElementById("password")
        .value;

      button.disabled = true;
      button.textContent = "در حال بررسی...";
      message.className = "message";

      try {
        const { data, error } =
          await supabase.functions.invoke(
            "login-with-username",
            {
              body: { username, password }
            }
          );

        if (error || !data?.success || !data?.session) {
          throw new Error(
            data?.error || "نام کاربری یا رمز عبور صحیح نیست."
          );
        }

        const { error: sessionError } =
          await supabase.auth.setSession({
            access_token: data.session.access_token,
            refresh_token: data.session.refresh_token
          });

        if (sessionError) {
          throw sessionError;
        }

        const roleName =
          data.profile.role === "admin"
            ? "مدیر اصلی"
            : "معلم";

        showMessage(
          "ورود موفقیت‌آمیز بود. خوش آمدید " +
          data.profile.full_name +
          " (" + roleName + ")",
          "success"
        );

        button.textContent = "ورود موفق بود";

      } catch (error) {
        showMessage(
          error.message || "ارتباط با سرور برقرار نشد.",
          "error"
        );

        button.disabled = false;
        button.textContent = "ورود به سامانه";
      }
    });
  </script>

</body>
</html>
