

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="سامانه هوشمند حضور و غیاب هنرستان علم و فن">
  <title>حضور و غیاب | هنرستان علم و فن</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Tahoma, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, #15366b55, transparent 35%),
        radial-gradient(circle at 85% 85%, #164e6355, transparent 35%),
        #080d18;
      color: #f1f5f9;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      padding: 38px 30px;
      background: #111a2beF;
      border: 1px solid #263c5c;
      border-radius: 24px;
      box-shadow: 0 25px 80px #0008;
    }

    .logo {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      box-shadow: 0 10px 30px #2563eb55;
      font-size: 35px;
    }

    .school-name {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #94a3b8;
      text-align: center;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 16px;
      margin-bottom: 22px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin: 19px 0 9px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #0b1220;
      color: white;
      outline: none;
      font-size: 14px;
      transition: .2s;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px #2563eb22;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 27px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 27px;
      color: #64748b;
      font-size: 11px;
      text-align: center;
      line-height: 2;
    }

    .version {
      color: #475569;
      text-align: center;
      font-size: 10px;
      margin-top: 10px;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 30px 22px;
      }

      .school-name {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">

    <div class="logo">🏫</div>

    <h1 class="school-name">هنرستان علم و فن</h1>

    <p class="subtitle">
      سامانه هوشمند مدیریت حضور و غیاب دانش‌آموزان
    </p>

    <h2 class="section-title">ورود به حساب کاربری</h2>

    <form id="loginForm">

      <label for="username">نام کاربری</label>
      <input
        id="username"
        type="text"
        placeholder="نام کاربری خود را وارد کنید"
        autocomplete="username"
        required
      >

      <label for="password">رمز عبور</label>
      <input
        id="password"
        type="password"
        placeholder="رمز عبور خود را وارد کنید"
        autocomplete="current-password"
        required
      >

      <button type="submit">ورود به سامانه</button>

    </form>

    <div class="footer">
      هنرستان علم و فن
      <br>
      سامانه اختصاصی مدیریت آموزشی و حضور و غیاب
    </div>

    <div class="version">
      نسخه 1.0.0
    </div>

  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();

      alert("اتصال امن به سامانه در مرحله بعد فعال می‌شود.");
    });
  </script>

</body>
</html>
