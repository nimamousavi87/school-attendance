
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="سامانه حضور و غیاب هنرستان علم و فن">
  <title>ورود به سامانه | علم و فن</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Tahoma, Arial, sans-serif;
      background:
        radial-gradient(circle at top right, #17345c 0, transparent 40%),
        radial-gradient(circle at bottom left, #102b43 0, transparent 35%),
        #080d18;
      color: #f8fafc;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2563eb, #0ea5e9);
      font-size: 30px;
      box-shadow: 0 10px 35px #2563eb44;
    }

    .logo h1 {
      font-size: 25px;
      margin: 0 0 10px;
    }

    .logo p {
      color: #94a3b8;
      font-size: 13px;
      margin: 0;
    }

    .login-box {
      background: rgba(17, 28, 46, 0.94);
      border: 1px solid #26364e;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 20px 60px #0005;
    }

    .login-box h2 {
      font-size: 19px;
      margin: 0 0 10px;
    }

    .description {
      color: #94a3b8;
      font-size: 13px;
      line-height: 2;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 10px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 11px;
      border: 1px solid #334155;
      outline: none;
      background: #0b1423;
      color: white;
      font-family: inherit;
      font-size: 14px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px #3b82f622;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover { filter: brightness(1.12); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 2;
      text-align: center;
    }

    #message.error {
      display: block;
      background: #7f1d1d33;
      color: #fca5a5;
      border: 1px solid #991b1b66;
    }

    #message.success {
      display: block;
      background: #14532d33;
      color: #86efac;
      border: 1px solid #16653466;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .login-box { padding: 25px 20px; }
      .logo h1 { font-size: 22px; }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <div class="logo-icon">🏫</div>
      <h1>هنرستان علم و فن</h1>
      <p>سامانه هوشمند حضور و غیاب</p>
    </div>

    <div class="login-box">

      <h2>ورود به حساب کاربری</h2>

      <div class="description">
        برای ورود به سامانه، نام کاربری و رمز عبور خود را وارد کنید.
      </div>

      <form id="loginForm">

        <label for="username">نام کاربری</label>
        <input
          type="text"
          id="username"
          placeholder="نام کاربری خود را وارد کنید"
          autocomplete="username"
          autocapitalize="none"
          required
          minlength="4"
          maxlength="30"
        >

        <label for="password">رمز عبور</label>
        <input
          type="password"
          id="password"
          placeholder="رمز عبور خود را وارد کنید"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginBtn">
          ورود به سامانه
        </button>

      </form>

      <div id="message"></div>

    </div>

    <div class="footer">
      © هنرستان علم و فن | تمامی حقوق محفوظ است
    </div>

  </div>

  <script type="module">

    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://tmogtldkiyxzdvercwro.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LMwuOofGL2VvLX1eE47czA_QLzYb1lU";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = type;
    }

    function setLoading(loading) {
      loginBtn.disabled = loading;
      loginBtn.textContent = loading
        ? "در حال بررسی..."
        : "ورود به سامانه";
    }

    async function checkExistingSession() {

      const { data } = await supabase.auth.getSession();

      if (!data.session) return;

      const { data: userData, error: userError } =
        await supabase.auth.getUser();

      if (userError || !userData.user) return;

      const { data: profile, error } = await supabase
        .from("profiles")
        .select("role, is_active")
        .eq("id", userData.user.id)
        .single();

      if (error || !profile || profile.is_active !== true) {
        await supabase.auth.signOut();
        return;
      }

      if (profile.role === "admin") {
        location.replace("admin.html");
      } else if (profile.role === "teacher") {
        location.replace("teacher.html");
      } else {
        await supabase.auth.signOut();
      }
    }

    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const username =
        usernameInput.value.trim().toLowerCase();

      const password = passwordInput.value;

      if (!username || !password) {
        showMessage(
          "لطفاً نام کاربری و رمز عبور را وارد کنید.",
          "error"
        );
        return;
      }

      setLoading(true);
      message.className = "";

      try {

        const { data, error } = await supabase.functions.invoke(
          "login-with-username",
          {
            body: {
              username,
              password
            }
          }
        );

        if (error) {
          throw new Error(
            "ارتباط با سرور برقرار نشد. دوباره تلاش کنید."
          );
        }

        if (
          !data ||
          !data.success ||
          !data.session ||
          !data.profile
        ) {
          throw new Error(
            data?.error ||
            "نام کاربری یا رمز عبور اشتباه است."
          );
        }

        if (data.profile.is_active === false) {
          throw new Error("حساب کاربری شما غیرفعال است.");
        }

        if (
          data.profile.role !== "admin" &&
          data.profile.role !== "teacher"
        ) {
          throw new Error("نقش کاربری معتبر نیست.");
        }

        const { error: sessionError } =
          await supabase.auth.setSession({
            access_token: data.session.access_token,
            refresh_token: data.session.refresh_token
          });

        if (sessionError) {
          throw new Error(
            "ایجاد نشست ورود ناموفق بود."
          );
        }

        showMessage(
          "ورود موفق بود. در حال انتقال...",
          "success"
        );

        if (data.profile.role === "admin") {
          location.replace("admin.html");
        } else {
          location.replace("teacher.html");
        }

      } catch (error) {

        showMessage(
          error.message || "خطایی رخ داد. دوباره تلاش کنید.",
          "error"
        );

      } finally {
        setLoading(false);
      }

    });

    checkExistingSession();

  </script>

</body>
</html>
